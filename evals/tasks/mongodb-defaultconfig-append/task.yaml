id: mongodb-defaultconfig-append
kind: seeded
source: "Seeded: the first line of mongodb's defaultconfig recipe appends instead of overwriting"
tier: static
max_turns: 25
prompt: |
  In sample-apps/mongodb, running `make defaultconfig` a second time leaves every key twice in
  jinja/variables/cloud-init.yaml, so the next render uses the wrong values. Fix it.
seed:
  reverse_patch: reference.patch
graders:
  lint_fixed:
    - app: mongodb
      contains: only appends
  scope:
    allowed: [sample-apps/mongodb/Makefile]
    required: [sample-apps/mongodb/Makefile]
  checks:
    # Any fix that overwrites the file passes, whatever path spelling it uses.
    - name: running defaultconfig twice writes each key once
      type: command
      run: |
        cd sample-apps/mongodb
        make defaultconfig >/dev/null
        make defaultconfig >/dev/null
        f=jinja/variables/cloud-init.yaml
        test "$(grep -c '' "$f")" -eq 6
        test "$(cut -d: -f1 "$f" | sort -u | wc -l | tr -d ' ')" -eq 6
rubric: |
  The first echo in defaultconfig must overwrite the file (>) and the rest append (>>). Nothing
  else in the Makefile should change.
