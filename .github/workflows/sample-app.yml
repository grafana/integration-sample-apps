name: "Sample app"

# Runs sample-apps and checks their expected metrics arrived. Pull requests here
# call it for the apps they change, and other repositories can call it to test
# an integration's change against its sample-app, passing their own metric lists
# or mixins.

permissions: {}

on:
  workflow_call:
    inputs:
      apps:
        description: Sample-apps to run, as a JSON array such as ["mysql"]. Give this or mixins.
        default: ""
        type: string
      mixins:
        description: Comma-separated grafana/jsonnet-libs mixins, to run the apps whose tests/dashboards names them
        default: ""
        type: string
      jsonnet-libs-ref:
        description: The grafana/jsonnet-libs branch, tag or commit to capture every mixin's dashboards at
        default: ""
        type: string
      repository:
        description: The repository to take the sample-apps from
        default: grafana/integration-sample-apps
        type: string
      ref:
        description: The branch, tag or commit to take the sample-apps from
        default: main
        type: string
      metrics-artifact:
        description: >-
          An artifact of the calling run holding expected-metric lists, <app> or <app>/<scenario>,
          which replace the apps' own tests/metrics files. Names with a # start a comment, and
          recording rule outputs (level:metric:operations) are skipped.
        default: ""
        type: string
      runner:
        description: The runner, which must support nested virtualization for Multipass
        default: ubuntu-latest-8-cores
        type: string

  workflow_dispatch:
    inputs:
      apps:
        description: Sample-apps to run, as a JSON array such as ["mysql"]. Give this or mixins.
        default: ""
        type: string
      mixins:
        description: Comma-separated grafana/jsonnet-libs mixins, to run the apps whose tests/dashboards names them
        default: ""
        type: string
      jsonnet-libs-ref:
        description: The grafana/jsonnet-libs branch, tag or commit to capture every mixin's dashboards at
        default: ""
        type: string
      ref:
        description: The branch, tag or commit to take the sample-apps from (default the one this runs on)
        default: ""
        type: string
      runner:
        description: The runner, which must support nested virtualization for Multipass
        default: ubuntu-latest-8-cores
        type: string

jobs:
  apps:
    name: Find sample-apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.mixin-apps.outputs.apps || inputs.apps }}
    steps:
      - name: Checkout
        if: inputs.mixins != ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || ((inputs.repository || github.repository) == github.repository && github.sha) || 'main' }}
          persist-credentials: false

      - name: Setup Go
        if: inputs.mixins != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Find the sample-apps of the mixins
        id: mixin-apps
        if: inputs.mixins != ''
        env:
          MIXINS: ${{ inputs.mixins }}
        run: go run ./ops/cmd/sampletool ci mixin-apps "${MIXINS}" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.sample-app }}
    needs: [apps]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    # An empty matrix fails the workflow
    if: needs.apps.outputs.apps != '[]' && needs.apps.outputs.apps != ''
    strategy:
      matrix:
        sample-app: ${{ fromJSON(needs.apps.outputs.apps) }}
      fail-fast: false
      max-parallel: 10
    steps:
      # A called workflow checks out its caller by default, so the repository is
      # always named. github.sha is the caller's commit, so it's only the default
      # here: called from elsewhere with no ref, the sample-apps run from main.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || ((inputs.repository || github.repository) == github.repository && github.sha) || 'main' }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build control plane
        run: |
          go build -o ops/bin/sampletool ./ops/cmd/sampletool
          echo "$GITHUB_WORKSPACE/ops/bin" >> "$GITHUB_PATH"

      # Sets the output `run`, and fails for a sample-app with neither expected metrics nor a .CI_BYPASS file
      - name: Check sample-app supports CI execution
        id: check_ci_support
        env:
          SAMPLE_APP: ${{ matrix.sample-app }}
        run: sampletool ci check "${SAMPLE_APP}" >> "$GITHUB_OUTPUT"

      # Temporary snapstore cache because they're having a lot of downtime
      - name: Restore Multipass snaps
        id: multipass_snaps
        if: steps.check_ci_support.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/multipass-snaps
          key: multipass-snaps-v1

      - name: Download Multipass snaps
        if: steps.check_ci_support.outputs.run == 'true' && steps.multipass_snaps.outputs.cache-hit != 'true'
        env:
          SNAPS: core24 gtk-common-themes gnome-46-2404 mesa-2404 multipass
        run: |
          mkdir -p ~/multipass-snaps && cd ~/multipass-snaps
          for snap in ${SNAPS}; do
            snap download "${snap}"
          done

      - name: Save Multipass snaps
        if: steps.check_ci_support.outputs.run == 'true' && steps.multipass_snaps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/multipass-snaps
          key: multipass-snaps-v1

      - name: Install Multipass
        if: steps.check_ci_support.outputs.run == 'true'
        env:
          SNAPS: core24 gtk-common-themes gnome-46-2404 mesa-2404 multipass
        run: |
          cd ~/multipass-snaps
          for snap in ${SNAPS}; do
            if snap list "${snap}" > /dev/null 2>&1; then continue; fi
            sudo snap ack "${snap}"_*.assert
            sudo snap install "${snap}"_*.snap
          done

      - name: Configure Multipass
        if: steps.check_ci_support.outputs.run == 'true'
        run: |
          timeout 60 bash -c 'until sudo test -S /var/snap/multipass/common/multipass_socket; do sleep 1; done'
          sudo chmod a+w /var/snap/multipass/common/multipass_socket

      - name: Setup databases
        if: steps.check_ci_support.outputs.run == 'true'
        run: sampletool dbs up --dbs dbs --env qa

      - name: Run ${{ matrix.sample-app }} sample-app
        id: run_sample_app
        if: steps.check_ci_support.outputs.run == 'true'
        env:
          SAMPLE_APP: ${{ matrix.sample-app }}
        run: sampletool apps up --apps "${SAMPLE_APP}"

      - name: Wait for sample-app to generate metrics
        if: steps.check_ci_support.outputs.run == 'true'
        run: sampletool apps wait

      - name: Download expected metrics
        if: steps.check_ci_support.outputs.run == 'true' && inputs.metrics-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.metrics-artifact }}
          path: ${{ runner.temp }}/expected-metrics

      - name: Check Prom metrics in Mimir
        if: steps.check_ci_support.outputs.run == 'true'
        env:
          SAMPLE_APP: ${{ matrix.sample-app }}
          METRICS_DIR: ${{ inputs.metrics-artifact != '' && format('{0}/expected-metrics', runner.temp) || '' }}
        run: |
          status=0
          sampletool apps test --apps "${SAMPLE_APP}" ${METRICS_DIR:+--metrics "${METRICS_DIR}"} || status=$?
          # The results table goes in the screenshots artifact too, for a calling repository to comment
          mkdir -p "screenshots/${SAMPLE_APP}"
          cp "${GITHUB_STEP_SUMMARY}" "screenshots/${SAMPLE_APP}/summary.md"
          exit "${status}"

      - name: Capture dashboard screenshots
        if: ${{ !cancelled() && steps.run_sample_app.outcome == 'success' }}
        continue-on-error: true
        env:
          SAMPLE_APP: ${{ matrix.sample-app }}
          JSONNET_LIBS_REF: ${{ inputs.jsonnet-libs-ref }}
          # Read-only, for listing mixin dashboards in grafana/jsonnet-libs
          GITHUB_TOKEN: ${{ github.token }}
        run: sampletool apps screenshot --apps "${SAMPLE_APP}" ${JSONNET_LIBS_REF:+--jsonnet-libs-ref "${JSONNET_LIBS_REF}"}

      - name: Upload dashboard screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.sample-app }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
