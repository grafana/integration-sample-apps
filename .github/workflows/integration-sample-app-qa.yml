name: "Sample Apps"

permissions:
  contents: read

on:
  pull_request:

jobs:
  check-for-changed-sample-apps:
    name: Check for changed sample apps
    runs-on: ubuntu-latest
    outputs:
      changed-sample-apps: ${{ steps.filtered-changes.outputs.filtered-dirs }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed sample apps
        id: changed-files
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          path: sample-apps
          dir_names: true
          dir_names_exclude_current_dir: true
          dir_names_max_depth: 1
          matrix: true

      - name: Filter out windows
        id: filtered-changes
        run: |
          ALL_CHANGED_DIRS='${{ steps.changed-files.outputs.all_changed_files }}'
          # Remove windows from the JSON array
          FILTERED_DIRS=$(echo "$ALL_CHANGED_DIRS" | jq -c '. - ["windows"]')
          echo "filtered-dirs=$FILTERED_DIRS" >> $GITHUB_OUTPUT

      - name: List all changed sample app dir_names (filtered)
        # NOTE: this is referred to as a file by the action, despite technically being a chunk of the directory in use
        env:
          ALL_CHANGED_FILES: ${{ steps.filtered-changes.outputs.filtered-dirs }}
        run: echo "${ALL_CHANGED_FILES}"

  sample-app-testing:
    name: Test sample-app
    # Sample app testing requires a runner with support for nested virtualization
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 30
    needs: [check-for-changed-sample-apps]
    # An empty matrix fails the workflow, so skip the job when no sample app changed
    if: needs.check-for-changed-sample-apps.outputs.changed-sample-apps != '[]' && needs.check-for-changed-sample-apps.outputs.changed-sample-apps != ''
    strategy:
      matrix:
        sample-app: ${{ fromJSON(needs.check-for-changed-sample-apps.outputs.changed-sample-apps) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build control plane
        run: |
          go build -o ops/bin/sampletool ./ops/cmd/sampletool
          echo "$GITHUB_WORKSPACE/ops/bin" >> "$GITHUB_PATH"

      # Sets the output `run`, and fails for a sample-app with neither expected metrics nor a .CI_BYPASS file
      - name: Check sample-app supports CI execution
        id: check_ci_support
        env:
          SAMPLE_APP: ${{ matrix.sample-app }}
        run: sampletool ci check "${SAMPLE_APP}" >> "$GITHUB_OUTPUT"

      - name: Install Multipass
        if: steps.check_ci_support.outputs.run == 'true'
        run: sudo snap install multipass

      - name: Configure Multipass
        if: steps.check_ci_support.outputs.run == 'true'
        run: |
          timeout 60 bash -c 'until sudo test -S /var/snap/multipass/common/multipass_socket; do sleep 1; done'
          sudo chmod a+w /var/snap/multipass/common/multipass_socket

      - name: Setup databases
        if: steps.check_ci_support.outputs.run == 'true'
        run: sampletool dbs up --dbs dbs --env qa

      - name: Run ${{ matrix.sample-app }} sample-app
        id: run_sample_app
        if: steps.check_ci_support.outputs.run == 'true'
        env:
          SAMPLE_APP: ${{ matrix.sample-app }}
        run: sampletool apps up --apps "${SAMPLE_APP}"

      - name: Wait for sample-app to generate metrics
        if: steps.check_ci_support.outputs.run == 'true'
        run: sampletool apps wait

      - name: Check Prom metrics in Mimir
        if: steps.check_ci_support.outputs.run == 'true'
        env:
          SAMPLE_APP: ${{ matrix.sample-app }}
        run: sampletool apps test --apps "${SAMPLE_APP}"

      - name: Capture dashboard screenshots
        if: ${{ !cancelled() && steps.run_sample_app.outcome == 'success' }}
        continue-on-error: true
        env:
          SAMPLE_APP: ${{ matrix.sample-app }}
        run: sampletool apps screenshot --apps "${SAMPLE_APP}"

      - name: Upload dashboard screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.sample-app }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

  publish-screenshots:
    name: Post dashboard screenshots
    runs-on: ubuntu-latest
    needs: [sample-app-testing]
    # Fork PRs only get a read-only token, their screenshots stay in the run's artifacts
    if: >-
      ${{ !cancelled() && needs.sample-app-testing.result != 'skipped'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      # Store the images under refs/screenshots/
      contents: write
      # Comment on the pull request
      pull-requests: write
    steps:
      - name: Download dashboard screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: screenshots-*
          merge-multiple: true
          path: screenshots

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The download creates no directory when no sample-app produced screenshots
          mkdir -p screenshots && cd screenshots
          shopt -s nullglob
          images=()
          for image in */*.png; do
            # File names come from the pull request, skip unexpected ones
            [[ "$image" =~ ^[A-Za-z0-9_/-]+\.png$ ]] && images+=("$image")
          done
          if [ ${#images[@]} -eq 0 ]; then
            echo "No sample-app produced screenshots"
            exit 0
          fi

          # Earlier runs are carried over from the existing comment, collapsed
          earlier=$(gh pr view "${PR}" --repo "${GITHUB_REPOSITORY}" --json comments --jq '[.comments[] | select(.viewerDidAuthor)] | last | .body // ""' \
            | sed -n '/^<details open><summary>Run /,$p' | sed 's/^<details open><summary>Run /<details><summary>Run /')
          # A comment holds 65536 characters, start over before the history fills it
          [ ${#earlier} -lt 50000 ] || earlier=""

          # The images go to a ref of their own in this repository. 
          git init --quiet
          git add -- "${images[@]}"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "Dashboard screenshots for #${PR}"
          base=""
          if git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:refs/screenshots/pr-${PR}/run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"; then
            url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$(git rev-parse HEAD)"
            # The links take a moment to work
            for attempt in 1 2 3 4 5; do
              if curl --silent --fail --head --output /dev/null "${url}/${images[0]}"; then base="${url}"; break; fi
              sleep 3
            done
          fi

          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "### Dashboard screenshots"
            echo
            echo "<details open><summary>Run ${GITHUB_RUN_NUMBER} · commit ${SHA::7} · $(date -u '+%d %b %H:%M UTC')</summary>"
            echo
            echo "Rendered from the data each sample-app produced in [this run](${run}), covering its last 5 minutes."
            if [ -z "${base}" ]; then
              echo
              echo "The images could not be stored for display here. They are in the artifacts of [this run](${run})."
            else
              for image in "${images[@]}"; do
                echo
                echo "<details open><summary>${image%.png}</summary>"
                echo
                echo "![${image%.png}](${base}/${image})"
                echo
                echo "</details>"
              done
            fi
            echo
            echo "</details>"
            echo
            echo "${earlier}"
          } > comment.md
          gh pr comment "${PR}" --repo "${GITHUB_REPOSITORY}" --edit-last --create-if-none --body-file comment.md
