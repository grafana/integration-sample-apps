name: "Sample Apps"

permissions:
  contents: read

on:
  # To conserve resources we only run tests against main in PRs
  pull_request:
    branches:
      - main

jobs:
  check-for-changed-sample-apps:
    name: Check for changed sample apps
    runs-on: ubuntu-latest
    outputs:
      changed-sample-apps: ${{ steps.filtered-changes.outputs.filtered-dirs }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed sample apps
        id: changed-files
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          path: sample-apps
          dir_names: true
          dir_names_exclude_current_dir: true
          dir_names_max_depth: 1
          matrix: true

      - name: Filter out windows
        id: filtered-changes
        run: |
          ALL_CHANGED_DIRS='${{ steps.changed-files.outputs.all_changed_files }}'
          # Remove windows from the JSON array
          FILTERED_DIRS=$(echo "$ALL_CHANGED_DIRS" | jq -c '. - ["windows"]')
          echo "filtered-dirs=$FILTERED_DIRS" >> $GITHUB_OUTPUT

      - name: List all changed sample app dir_names (filtered)
        # NOTE: this is referred to as a file by the action, despite technically being a chunk of the directory in use
        env:
          ALL_CHANGED_FILES: ${{ steps.filtered-changes.outputs.filtered-dirs }}
        run: echo "${ALL_CHANGED_FILES}"

  sample-app-testing:
    name: Test sample-app
    # Sample app testing requires a runner with support for nested virtualization
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 30
    needs: [check-for-changed-sample-apps]
    # An empty matrix fails the workflow, so skip the job when no sample app changed
    if: needs.check-for-changed-sample-apps.outputs.changed-sample-apps != '[]' && needs.check-for-changed-sample-apps.outputs.changed-sample-apps != ''
    strategy:
      matrix:
        sample-app: ${{ fromJSON(needs.check-for-changed-sample-apps.outputs.changed-sample-apps) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build control plane
        run: |
          go build -o ops/bin/sampletool ./ops/cmd/sampletool
          echo "$GITHUB_WORKSPACE/ops/bin" >> "$GITHUB_PATH"

      # Sets the output `run`, and fails for a sample-app with neither expected metrics nor a .CI_BYPASS file
      - name: Check sample-app supports CI execution
        id: check_ci_support
        env:
          SAMPLE_APP: ${{ matrix.sample-app }}
        run: sampletool ci check "${SAMPLE_APP}" >> "$GITHUB_OUTPUT"

      - name: Install Multipass
        if: steps.check_ci_support.outputs.run == 'true'
        run: sudo snap install multipass

      - name: Configure Multipass
        if: steps.check_ci_support.outputs.run == 'true'
        run: |
          timeout 60 bash -c 'until sudo test -S /var/snap/multipass/common/multipass_socket; do sleep 1; done'
          sudo chmod a+w /var/snap/multipass/common/multipass_socket

      - name: Setup databases
        if: steps.check_ci_support.outputs.run == 'true'
        run: sampletool dbs up --dbs dbs --env qa

      - name: Run ${{ matrix.sample-app }} sample-app
        if: steps.check_ci_support.outputs.run == 'true'
        env:
          SAMPLE_APP: ${{ matrix.sample-app }}
        run: sampletool apps up --apps "${SAMPLE_APP}"

      - name: Wait for sample-app to generate metrics
        if: steps.check_ci_support.outputs.run == 'true'
        run: sampletool apps wait

      - name: Check Prom metrics in Mimir
        if: steps.check_ci_support.outputs.run == 'true'
        env:
          SAMPLE_APP: ${{ matrix.sample-app }}
        run: sampletool apps test --apps "${SAMPLE_APP}"
