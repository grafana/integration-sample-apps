name: "Sample Apps"

permissions:
  contents: read

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-for-changed-sample-apps:
    name: Check for changed sample apps
    runs-on: ubuntu-latest
    outputs:
      changed-sample-apps: ${{ steps.filtered-changes.outputs.filtered-dirs }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed sample apps
        id: changed-files
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          path: sample-apps
          dir_names: true
          dir_names_exclude_current_dir: true
          dir_names_max_depth: 1
          matrix: true

      - name: Filter out windows and deleted sample apps
        id: filtered-changes
        env:
          MODIFIED_DIRS: ${{ steps.changed-files.outputs.all_modified_files }}
        run: |
          set -euo pipefail
          FILTERED_DIRS=$(jq -r '.[] | select(. != "windows")' <<< "${MODIFIED_DIRS}" |
            while IFS= read -r dir; do
              if [[ -d "sample-apps/${dir}" ]]; then echo "${dir}"; fi
            done | jq -Rnc '[inputs]')
          echo "filtered-dirs=${FILTERED_DIRS}" >> "${GITHUB_OUTPUT}"

      - name: List all changed sample app dir_names (filtered)
        # NOTE: this is referred to as a file by the action, despite technically being a chunk of the directory in use
        env:
          ALL_CHANGED_FILES: ${{ steps.filtered-changes.outputs.filtered-dirs }}
        run: echo "${ALL_CHANGED_FILES}"

  sample-app-testing:
    name: Test sample-app
    # Sample app testing requires a runner with support for nested virtualization
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 30
    needs: [check-for-changed-sample-apps]
    # An empty matrix fails the workflow, so skip the job when no sample app changed
    if: needs.check-for-changed-sample-apps.outputs.changed-sample-apps != '[]' && needs.check-for-changed-sample-apps.outputs.changed-sample-apps != ''
    strategy:
      matrix:
        sample-app: ${{ fromJSON(needs.check-for-changed-sample-apps.outputs.changed-sample-apps) }}
      fail-fast: false
      max-parallel: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build control plane
        run: |
          go build -o ops/bin/sampletool ./ops/cmd/sampletool
          echo "$GITHUB_WORKSPACE/ops/bin" >> "$GITHUB_PATH"

      # Sets the output `run`, and fails for a sample-app with neither expected metrics nor a .CI_BYPASS file
      - name: Check sample-app supports CI execution
        id: check_ci_support
        env:
          SAMPLE_APP: ${{ matrix.sample-app }}
        run: sampletool ci check "${SAMPLE_APP}" >> "$GITHUB_OUTPUT"
      
      # Temporary snapstore cache because they're having a lot of downtime
      - name: Restore Multipass snaps
        id: multipass_snaps
        if: steps.check_ci_support.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/multipass-snaps
          key: multipass-snaps-v1

      - name: Download Multipass snaps
        if: steps.check_ci_support.outputs.run == 'true' && steps.multipass_snaps.outputs.cache-hit != 'true'
        env:
          SNAPS: core24 gtk-common-themes gnome-46-2404 mesa-2404 multipass
        run: |
          mkdir -p ~/multipass-snaps && cd ~/multipass-snaps
          for snap in ${SNAPS}; do
            snap download "${snap}"
          done

      - name: Save Multipass snaps
        if: steps.check_ci_support.outputs.run == 'true' && steps.multipass_snaps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/multipass-snaps
          key: multipass-snaps-v1

      - name: Install Multipass
        if: steps.check_ci_support.outputs.run == 'true'
        env:
          SNAPS: core24 gtk-common-themes gnome-46-2404 mesa-2404 multipass
        run: |
          cd ~/multipass-snaps
          for snap in ${SNAPS}; do
            if snap list "${snap}" > /dev/null 2>&1; then continue; fi
            sudo snap ack "${snap}"_*.assert
            sudo snap install "${snap}"_*.snap
          done

      - name: Configure Multipass
        if: steps.check_ci_support.outputs.run == 'true'
        run: |
          timeout 60 bash -c 'until sudo test -S /var/snap/multipass/common/multipass_socket; do sleep 1; done'
          sudo chmod a+w /var/snap/multipass/common/multipass_socket

      - name: Setup databases
        if: steps.check_ci_support.outputs.run == 'true'
        run: sampletool dbs up --dbs dbs

      - name: Run ${{ matrix.sample-app }} sample-app
        id: run_sample_app
        if: steps.check_ci_support.outputs.run == 'true'
        env:
          SAMPLE_APP: ${{ matrix.sample-app }}
        run: sampletool apps up --apps "${SAMPLE_APP}"

      - name: Wait for sample-app to generate metrics
        if: steps.check_ci_support.outputs.run == 'true'
        run: sampletool apps wait

      - name: Check Prom metrics in Mimir
        if: steps.check_ci_support.outputs.run == 'true'
        env:
          SAMPLE_APP: ${{ matrix.sample-app }}
        run: sampletool apps test --apps "${SAMPLE_APP}"

      - name: Capture dashboard screenshots
        if: ${{ !cancelled() && steps.run_sample_app.outcome == 'success' }}
        continue-on-error: true
        env:
          SAMPLE_APP: ${{ matrix.sample-app }}
          # Read-only, for listing mixin dashboards in grafana/jsonnet-libs
          GITHUB_TOKEN: ${{ github.token }}
        run: sampletool apps screenshot --apps "${SAMPLE_APP}"

      - name: Upload dashboard screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.sample-app }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

  publish-screenshots:
    name: Post dashboard screenshots
    runs-on: ubuntu-latest
    needs: [sample-app-testing]
    # Fork PRs only get a read-only token, their screenshots stay in the run's artifacts
    if: >-
      ${{ !cancelled() && needs.sample-app-testing.result != 'skipped'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    concurrency:
      group: screenshots-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      # Store the images under refs/screenshots/
      contents: write
      # Comment on the pull request
      pull-requests: write
    steps:
      - name: Download dashboard screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: screenshots-*
          merge-multiple: true
          path: screenshots

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The download creates no directory when no sample-app produced screenshots
          mkdir -p screenshots && cd screenshots
          shopt -s nullglob
          # <app>/<dashboard>.png, or <app>/<ref>/<mixin>/<dashboard>.png for one listed from a mixin
          images=()
          mixin_images=()
          other_images=()
          segment='[A-Za-z0-9][A-Za-z0-9_.-]*'
          for image in */*.png */*/*/*.png; do
            # File names come from the pull request, skip unexpected ones
            if [[ "$image" =~ ^${segment}/${segment}/${segment}/[A-Za-z0-9_-]+\.png$ ]]; then
              mixin_images+=("$image")
            elif [[ "$image" =~ ^${segment}/[A-Za-z0-9_-]+\.png$ ]]; then
              other_images+=("$image")
            else
              continue
            fi
            images+=("$image")
          done
          if [ ${#images[@]} -eq 0 ]; then
            echo "No sample-app produced screenshots"
            exit 0
          fi

          # Other workflows comment as github-actions[bot] too, so the screenshot comment is found by its marker
          marker="<!-- sample-app-screenshots -->"
          comment=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | tail -n 1)

          # Earlier runs are carried over from the existing comment, collapsed
          earlier=""
          if [ -n "${comment}" ]; then
            earlier=$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment}" --jq .body \
              | sed -n '/^<details open><summary>Run /,$p' | sed 's/^<details open><summary>Run /<details><summary>Run /')
          fi

          # The images go to a ref of their own in this repository. 
          git init --quiet
          git add -- "${images[@]}"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "Dashboard screenshots for #${PR}"
          base=""
          if git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:refs/screenshots/pr-${PR}/run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"; then
            url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$(git rev-parse HEAD)"
            # The links take a moment to work
            for attempt in 1 2 3 4 5; do
              if curl --silent --fail --head --output /dev/null "${url}/${images[0]}"; then base="${url}"; break; fi
              sleep 3
            done
          fi

          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          section() { echo; echo "<details${2:+ open}><summary>$1</summary>"; echo; echo "<blockquote>"; echo; }
          end_section() { echo; echo "</blockquote>"; echo "</details>"; }
          screenshot() {
            local name="${1##*/}"
            section "${name%.png}" open
            echo "![${name%.png}](${base}/$1)"
            end_section
          }
          header() {
            echo "${marker}"
            echo "### Dashboard screenshots"
            echo
            echo "<details open><summary>Run ${GITHUB_RUN_NUMBER} · commit ${SHA::7} · $(date -u '+%d %b %H:%M UTC')</summary>"
            echo
            echo "<blockquote>"
            echo
            echo "Rendered from the data each sample-app produced in [this run](${run}), covering its last 5 minutes."
          }
          footer() { echo; echo "</blockquote>"; echo "</details>"; echo; }
          {
            header
            if [ -z "${base}" ]; then
              echo
              echo "The images could not be stored for display here. They are in the artifacts of [this run](${run})."
            else
              # Mixin dashboards nest under their mixin, named with its jsonnet-libs ref unless that is master
              for group in $(printf '%s\n' "${mixin_images[@]}" | awk -F/ 'NF == 4 { print $3 "/" $2 "/" $1 }' | sort -u); do
                IFS=/ read -r mixin ref app <<< "${group}"
                matching=()
                for image in "${mixin_images[@]}"; do
                  if [[ "$image" == "${app}/${ref}/${mixin}/"* ]]; then matching+=("$image"); fi
                done
                label="${mixin}"
                if [ "${ref}" != master ]; then label="${mixin}@${ref}"; fi
                section "${label} · ${app} sample-app · ${#matching[@]} dashboard$([ ${#matching[@]} -eq 1 ] || echo s)"
                for image in "${matching[@]}"; do screenshot "$image"; done
                end_section
              done
              # Dashboards listed by URL nest under their sample-app
              for app in $(printf '%s\n' "${other_images[@]}" | cut -d/ -f1 | sort -u); do
                matching=()
                for image in "${other_images[@]}"; do
                  if [[ "$image" == "${app}/"* ]]; then matching+=("$image"); fi
                done
                section "${app} sample-app · ${#matching[@]} dashboard$([ ${#matching[@]} -eq 1 ] || echo s)"
                for image in "${matching[@]}"; do screenshot "$image"; done
                end_section
              done
            fi
            footer
          } > current.md

          limit=65000
          if [ "$(wc -c < current.md)" -gt "${limit}" ]; then
            {
              header
              echo
              echo "This run captured too many screenshots to show here. They are in the artifacts of [this run](${run})."
              footer
            } > current.md
          fi
          # Earlier runs are kept newest first while they fit, dropping the oldest
          printf '%s\n' "${earlier}" | awk -v budget="$(( limit - $(wc -c < current.md) ))" '
            /^<details><summary>Run / { if (block != "") runs[++n] = block; block = "" }
            { block = block $0 "\n" }
            END {
              if (block != "") runs[++n] = block
              for (i = 1; i <= n && used + length(runs[i]) <= budget; i++) { used += length(runs[i]); printf "%s", runs[i] }
            }' > earlier.md
          cat current.md earlier.md > comment.md

          if [ -n "${comment}" ]; then
            gh api --silent --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment}" -F body=@comment.md
          else
            gh api --silent --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@comment.md
          fi
