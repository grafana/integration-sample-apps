# Do not use this configuration in production.
# It is for demonstration purposes only.
multitenancy_enabled: false

activity_tracker: {}

alertmanager: {}

alertmanager_storage:
  backend: local

server:
  http_listen_port: 9009

  # Configure the server to allow messages up to 100MB.
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600
  grpc_server_max_concurrent_streams: 1000

distributor:
  pool:
    health_check_ingesters: true

ingester_client:
  grpc_client_config:
    grpc_compression: gzip
    max_recv_msg_size: 104857600
    max_send_msg_size: 104857600

ingester:
  ring:
    final_sleep: 0s
    kvstore:
      store: inmemory
    min_ready_duration: 0s
    num_tokens: 512
    replication_factor: 1

blocks_storage:
  backend: filesystem
  bucket_store:
    sync_dir: /tmp/mimir/tsdb-sync
  filesystem:
    dir: /tmp/mimir/blocks
  tsdb:
    dir: /tmp/mimir/tsdb

compactor:
  sharding_ring:
    kvstore:
      store: inmemory

ruler:
  enable_api: true

ruler_storage:
  backend: filesystem
  local:
    directory: /tmp/mimir/rules

limits:
  ingestion_burst_size: 500000
  ingestion_rate: 250000
  native_histograms_ingestion_enabled: true

  # Grafana Cloud defaults that aren't autoscaled, from
  # https://grafana.com/docs/grafana-cloud/platform/pricing-and-usage/usage-limits/
  # and https://grafana.com/docs/grafana-cloud/send-data/metrics/label-handling-and-limits/
  # Autoscaled limits such as ingestion_rate are left higher than Cloud's starting values.
  out_of_order_time_window: 2h
  max_global_exemplars_per_user: 100000
  label_value_length_over_limit_strategy: truncate
  max_partial_query_length: 32d
  max_labels_query_length: 32d
  max_query_expression_size_bytes: 131072
